<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fila de Estudo - React</title>

        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
    </head>

    <body>
        <div id="root"></div>

        <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
        <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

        <script type="text/babel">

            // Representação do título das matérias

            function StudyHeader({ studies }) {
                const completedSubject = studies.filter((study) => study.status === true)


                return (
                    <header>
                        <h2>Fila de Estudos</h2>
                        <p>{completedSubject.length} de 3 concluídos</p>
                    </header>
                )
            }
            // Componente que representa a matéria

            function StudyItem({ id, name, duration, status, toggleStudyStatus }) {
                return (
                    <div>
                        <h3>{name}</h3>
                        <p>ID: {id}</p>
                        <p>Duração: {duration} minutos</p>
                        <p>Status: {status === false ? 'Não concluído' : 'Concluído'}</p>
                        <button onClick={() => toggleStudyStatus(id)}>Concluir</button>
                    </div>
                )
            }

            // Lista de matérias

            function StudyList({ studies, toggleStudyStatus }) {
                return (
                    <section>
                        {studies.map((study) =>
                            <StudyItem
                                key={study.id}
                                id={study.id}
                                name={study.name}
                                duration={study.duration}
                                status={study.status}
                                toggleStudyStatus={toggleStudyStatus}
                            />
                        )}
                    </section>
                )
            }

            function App() {
                const [studies, setStudies] = React.useState([{
                    id: "A7K2M",
                    name: "JavaScript",
                    duration: "40",
                    status: false,
                },
                {
                    id: "P4X9B",
                    name: "TypeScript",
                    duration: "20",
                    status: false,
                },
                {
                    id: "R8N3C",
                    name: "React Native",
                    duration: "60",
                    status: false,
                }
                ])

                function toggleStudyStatus(id) {
                    setStudies(studies.map((study) => id === study.id ? { ...study, status: !study.status } : study))
                }

                return (
                    <main>
                        <h1>Minhas Tarefas de Estudo</h1>
                        <StudyHeader studies={studies} />
                        <StudyList studies={studies} toggleStudyStatus={toggleStudyStatus} />
                    </main>
                )
            }

            // ReactDom... -> Define em qual elemento HTML o REACT vai montar a aplicação
            // .render() -> Define qual componente será exibido dentro desse elemento

            ReactDOM.createRoot(document.getElementById('root')).render(<App />)
        </script>
    </body>

</html>
